name: ${COMPOSE_PROJECT_NAME:-hehuoda-deploy}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  api:
    image: ${API_IMAGE:-${IMAGE_PREFIX:?set IMAGE_PREFIX}/api:${IMAGE_TAG:?set IMAGE_TAG}}
    build:
      context: .
      target: api
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL using db:5432}
      SWAGGER_ENABLED: "false"
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-}
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-12}
      ADMIN_RATE_LOGIN_ACCOUNT: ${ADMIN_RATE_LOGIN_ACCOUNT:-5}
      ADMIN_RATE_LOGIN_SOURCE: ${ADMIN_RATE_LOGIN_SOURCE:-30}
      ADMIN_RATE_LOGIN_GLOBAL: ${ADMIN_RATE_LOGIN_GLOBAL:-100}
      INGESTION_ENABLED: ${INGESTION_ENABLED:-false}
      INGESTION_RAW_DAYS: ${INGESTION_RAW_DAYS:-30}
      # 仅从服务器受保护的 .env 注入；默认关闭，密钥不进入镜像。
      WECHAT_LOGIN_ENABLED: ${WECHAT_LOGIN_ENABLED:-false}
      WECHAT_LOGIN_ADAPTER: real
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      CAMPUS_VERIFICATION_ENABLED: ${CAMPUS_VERIFICATION_ENABLED:-false}
      CAMPUS_POLICY_VERSION: ${CAMPUS_POLICY_VERSION:-2}
      CAMPUS_TERMS: ${CAMPUS_TERMS:-[]}
      CAMPUS_SUBJECT_HMAC_KEY: ${CAMPUS_SUBJECT_HMAC_KEY:-}
      CAMPUS_PROFILE_KEYS: ${CAMPUS_PROFILE_KEYS:-{}}
      CAMPUS_PROFILE_KEY_ID: ${CAMPUS_PROFILE_KEY_ID:-}
      CAMPUS_RATE_SUBMIT_USER: ${CAMPUS_RATE_SUBMIT_USER:-5}
      CAMPUS_RATE_SUBMIT_SOURCE: ${CAMPUS_RATE_SUBMIT_SOURCE:-100}
      CAMPUS_RATE_SUBMIT_GLOBAL: ${CAMPUS_RATE_SUBMIT_GLOBAL:-500}
      CAMPUS_RATE_CHALLENGE_USER: ${CAMPUS_RATE_CHALLENGE_USER:-5}
      CAMPUS_RATE_CHALLENGE_SOURCE: ${CAMPUS_RATE_CHALLENGE_SOURCE:-100}
      CAMPUS_RATE_CHALLENGE_GLOBAL: ${CAMPUS_RATE_CHALLENGE_GLOBAL:-500}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    logging: *logging

  web:
    image: ${WEB_IMAGE:-${IMAGE_PREFIX:?set IMAGE_PREFIX}/web:${IMAGE_TAG:?set IMAGE_TAG}}
    build:
      context: .
      target: web
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/_health]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  database:
