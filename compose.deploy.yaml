name: ${COMPOSE_PROJECT_NAME:-hehuoda-deploy}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    networks: [database]
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - database:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  api:
    networks:
      database: {}
      proxy: {}
    image: ${API_IMAGE:-${IMAGE_PREFIX:?set IMAGE_PREFIX}/api:${IMAGE_TAG:?set IMAGE_TAG}}
    build:
      context: .
      target: api
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      # 只信任专用网络中 Nginx 的固定地址；数据库网络及其他容器不能伪造来源。
      API_TRUSTED_PROXY_CIDRS: ${PROXY_ADDRESS_PREFIX:-172.30.135}.3/32
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL using db:5432}
      SWAGGER_ENABLED: "false"
      INGESTION_ENABLED: ${INGESTION_ENABLED:-false}
      INGESTION_RAW_DAYS: ${INGESTION_RAW_DAYS:-30}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    logging: *logging

  web:
    networks:
      proxy:
        ipv4_address: ${PROXY_ADDRESS_PREFIX:-172.30.135}.3
    image: ${WEB_IMAGE:-${IMAGE_PREFIX:?set IMAGE_PREFIX}/web:${IMAGE_TAG:?set IMAGE_TAG}}
    build:
      context: .
      target: web
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/_health]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

volumes:
  database:
networks:
  database:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_ADDRESS_PREFIX:-172.30.135}.0/24
