# 显式提供 peer 的宿主，不覆盖版本、不放宽 peer 检查。
packageExtensions:
  "@dcloudio/uni-cli-shared@3.0.0-5020420260813003":
    dependencies:
      vue: 3.4.21
  "@dcloudio/uni-h5@3.0.0-5020420260813003":
    dependencies:
      vue: 3.4.21
  "@dcloudio/uni-h5-vue@3.0.0-5020420260813003":
    dependencies:
      vue: 3.4.21
