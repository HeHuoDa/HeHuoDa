name: 功能建议
description: 提出需要讨论的功能或改进
title: "[Feature][端别][层次] "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        标题中的 `[端别]` 请替换为 `[管理端]`、`[用户端]` 或共享任务的 `[管理端/用户端]`；`[层次]` 请替换为 `[前端]` 或 `[后端]`。前后端开发分别建 Issue，确需整体交付的共享基础设施任务可用 `[前后端]`。完整约定见仓库 `docs/agents/issue-tracker.md`。
  - type: textarea
    id: problem
    attributes:
      label: 问题与使用场景
      description: 谁在什么场景下遇到了什么问题？领域术语遵循 CONTEXT.md。
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望效果
      description: 从使用者角度描述改进后可以完成的操作。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 列出可以演示或验证的完成条件。
      placeholder: |
        - [ ] 完成条件一
        - [ ] 完成条件二
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与范围
      description: 可填写考虑过的其他方案、本次范围，以及暂不包含的功能。
  - type: textarea
    id: references
    attributes:
      label: 相关资料
      description: 可关联已有 Issue、架构决策或界面草图。
