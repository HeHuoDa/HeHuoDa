name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA with a successful push/manual CI archive
        required: true
        type: string
      action:
        description: prepare only transfers, verifies and imports; deploy replaces the application
        required: true
        default: prepare
        type: choice
        options: [prepare, deploy, rollback]

permissions:
  contents: read
  actions: read

concurrency:
  group: hehuoda-production-deploy
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.DEPLOY_ARCHIVE_ACTIVATE == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
      DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_TLS: ${{ vars.DEPLOY_TLS }}
      DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
      DEPLOY_ARCHIVE_ACTIVATE: ${{ vars.DEPLOY_ARCHIVE_ACTIVATE }}
      RELEASE_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Verify the exact main release passed CI and retained its archive
        id: verified
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DEPLOY_ACTION" =~ ^(prepare|deploy|rollback)$ ]]
          if [[ "$DEPLOY_ACTION" == rollback ]]; then
            # A retained successful version may outlive its GitHub artifact.
            echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RELEASE_EVENT" == workflow_run ]]; then
            current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current_main" != "$CANDIDATE_SHA" ]]; then
              echo 'Skipping superseded automatic release; explicit manual rollback remains available.'
              exit 0
            fi
          fi
          verified=false
          for ci_event in push workflow_dispatch; do
            run_ids=$(gh api --paginate "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE_SHA&branch=main&event=$ci_event&status=success&per_page=100" --jq '.workflow_runs[].id')
            for run_id in $run_ids; do
              artifacts=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
              for artifact in $artifacts; do
                if [[ "$artifact" =~ ^release-archive-$CANDIDATE_SHA-([0-9]+)$ ]]; then
                  attempt="${BASH_REMATCH[1]}"
                  smoke_counts=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" --jq '[.jobs[] | select(.name == "image-smoke" and .conclusion == "success")] | length')
                  if grep -Eq '^[1-9][0-9]*$' <<< "$smoke_counts"; then
                    verified=true
                    break 3
                  fi
                fi
              done
            done
          done
          if [[ "$verified" != true ]]; then
            echo 'No successful main CI with a retained release archive for the exact SHA.' >&2
            exit 1
          fi
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      # The controller always comes from the trusted default branch; the target
      # commit only supplies its own Compose, Nginx and manifest files.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.verified.outputs.sha != ''
        with:
          ref: main
          path: controller
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.verified.outputs.sha != '' && steps.verified.outputs.artifact != ''
        with:
          ref: ${{ steps.verified.outputs.sha }}
          path: target
          persist-credentials: false
      - name: Download the retained archive artifact
        if: steps.verified.outputs.sha != '' && steps.verified.outputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.verified.outputs.artifact }}
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-archive
      - name: Assemble and re-verify the payload before connecting to the server
        if: steps.verified.outputs.sha != ''
        env:
          ARCHIVE_RUN_ID: ${{ steps.verified.outputs.run_id }}
          ARCHIVE_RUN_ATTEMPT: ${{ steps.verified.outputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/payload"
          mkdir -p "$payload/deploy"
          cp controller/deploy/*.mjs "$payload/deploy/"
          if [[ "$DEPLOY_ACTION" != rollback ]]; then
            cp target/compose.deploy.yaml target/compose.tls.yaml "$payload/"
            mkdir -p "$payload/deploy/nginx"
            cp target/deploy/nginx/https.conf "$payload/deploy/nginx/"
            cp "$RUNNER_TEMP/release-archive/images.tar.gz" "$RUNNER_TEMP/release-archive/release.json" "$payload/"
            node controller/deploy/archive.mjs verify "$payload" "$CANDIDATE_SHA"
          fi
          tar -czf "$RUNNER_TEMP/payload.tar.gz" -C "$payload" .
      - name: Prepare pinned SCP transport and isolated staging
        id: transport
        if: steps.verified.outputs.sha != ''
        shell: bash
        run: bash controller/deploy/scp.sh setup
      - name: Upload the 1 MiB probe with SCP
        id: probe
        if: steps.verified.outputs.sha != ''
        # Bound the whole client; its connection timeout does not bound every SSH phase.
        timeout-minutes: 2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ env.SCP_PORT }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ env.SCP_FINGERPRINT }}
          source: ${{ env.SCP_SOURCE_DIR }}/probe
          target: ${{ env.SCP_STAGING }}/probe
          tar_tmp_path: ${{ env.SCP_STAGING }}/
          strip_components: 1
          overwrite: true
          timeout: 30s
          command_timeout: 90s
      - name: Verify the SCP probe before uploading the archive
        if: steps.verified.outputs.sha != ''
        shell: bash
        run: bash controller/deploy/scp.sh probe
      - name: Upload the verified payload with SCP (attempt 1)
        id: upload
        if: steps.verified.outputs.sha != ''
        timeout-minutes: 10
        continue-on-error: true
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ env.SCP_PORT }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ env.SCP_FINGERPRINT }}
          source: ${{ env.SCP_SOURCE_DIR }}/payload.tar.gz
          target: ${{ env.SCP_STAGING }}/upload
          tar_tmp_path: ${{ env.SCP_STAGING }}/
          strip_components: 1
          overwrite: true
          timeout: 30s
          command_timeout: 10m
      - name: Check for a complete payload even if the SCP response was lost
        id: received
        if: ${{ !cancelled() && steps.verified.outputs.sha != '' && (steps.upload.outcome == 'success' || steps.upload.outcome == 'failure') }}
        shell: bash
        run: bash controller/deploy/scp.sh received
      - name: Prepare one retry for an incomplete payload
        if: steps.verified.outputs.sha != '' && steps.received.outputs.valid == 'false'
        shell: bash
        run: bash controller/deploy/scp.sh retry
      - name: Upload the verified payload with SCP (attempt 2)
        if: steps.verified.outputs.sha != '' && steps.received.outputs.valid == 'false'
        timeout-minutes: 10
        # Final length/hash verification decides whether the payload is usable.
        continue-on-error: true
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ env.SCP_PORT }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ env.SCP_FINGERPRINT }}
          source: ${{ env.SCP_SOURCE_DIR }}/payload.tar.gz
          target: ${{ env.SCP_STAGING }}/upload
          tar_tmp_path: ${{ env.SCP_STAGING }}/
          strip_components: 1
          overwrite: true
          timeout: 30s
          command_timeout: 10m
      - name: Verify the received archive before extracting it
        if: steps.verified.outputs.sha != ''
        shell: bash
        run: bash controller/deploy/scp.sh verify
      - name: Run the existing release action
        if: steps.verified.outputs.sha != ''
        shell: bash
        run: bash controller/deploy/scp.sh deliver
      - name: Clean this attempt's SCP staging files
        if: ${{ always() && steps.verified.outputs.sha != '' && steps.transport.outcome != 'skipped' }}
        timeout-minutes: 2
        shell: bash
        run: bash controller/deploy/scp.sh cleanup
