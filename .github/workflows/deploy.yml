name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA with a successful push/manual CI archive
        required: true
        type: string
      action:
        description: prepare only transfers, verifies and imports; deploy replaces the application
        required: true
        default: prepare
        type: choice
        options: [prepare, deploy, rollback]

permissions:
  contents: read
  actions: read

concurrency:
  group: hehuoda-production-deploy
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       vars.DEPLOY_ARCHIVE_ACTIVATE == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
      DEPLOY_ACTION: ${{ inputs.action || 'deploy' }}
    steps:
      - name: Verify the exact main release passed CI and retained its archive
        id: verified
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$DEPLOY_ACTION" =~ ^(prepare|deploy|rollback)$ ]]
          if [[ "$DEPLOY_ACTION" == rollback ]]; then
            # A retained successful version may outlive its GitHub artifact.
            echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$RELEASE_EVENT" == workflow_run ]]; then
            current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current_main" != "$CANDIDATE_SHA" ]]; then
              echo 'Skipping superseded automatic release; explicit manual rollback remains available.'
              exit 0
            fi
          fi
          verified=false
          for ci_event in push workflow_dispatch; do
            run_ids=$(gh api --paginate "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE_SHA&branch=main&event=$ci_event&status=success&per_page=100" --jq '.workflow_runs[].id')
            for run_id in $run_ids; do
              artifacts=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
              for artifact in $artifacts; do
                if [[ "$artifact" =~ ^release-archive-$CANDIDATE_SHA-([0-9]+)$ ]]; then
                  attempt="${BASH_REMATCH[1]}"
                  smoke_counts=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" --jq '[.jobs[] | select(.name == "image-smoke" and .conclusion == "success")] | length')
                  if grep -Eq '^[1-9][0-9]*$' <<< "$smoke_counts"; then
                    verified=true
                    break 3
                  fi
                fi
              done
            done
          done
          if [[ "$verified" != true ]]; then
            echo 'No successful main CI with a retained release archive for the exact SHA.' >&2
            exit 1
          fi
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "attempt=$attempt" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      # The controller always comes from the trusted default branch; the target
      # commit only supplies its own Compose, Nginx and manifest files.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.verified.outputs.sha != ''
        with:
          ref: main
          path: controller
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.verified.outputs.sha != '' && steps.verified.outputs.artifact != ''
        with:
          ref: ${{ steps.verified.outputs.sha }}
          path: target
          persist-credentials: false
      - name: Download the retained archive artifact
        if: steps.verified.outputs.sha != '' && steps.verified.outputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.verified.outputs.artifact }}
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-archive
      - name: Assemble and re-verify the payload before connecting to the server
        if: steps.verified.outputs.sha != ''
        env:
          ARCHIVE_RUN_ID: ${{ steps.verified.outputs.run_id }}
          ARCHIVE_RUN_ATTEMPT: ${{ steps.verified.outputs.attempt }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/payload"
          mkdir -p "$payload/deploy"
          cp controller/deploy/*.mjs "$payload/deploy/"
          if [[ "$DEPLOY_ACTION" != rollback ]]; then
            cp target/compose.deploy.yaml target/compose.tls.yaml "$payload/"
            mkdir -p "$payload/deploy/nginx"
            cp target/deploy/nginx/https.conf "$payload/deploy/nginx/"
            cp "$RUNNER_TEMP/release-archive/images.tar.gz" "$RUNNER_TEMP/release-archive/release.json" "$payload/"
            node controller/deploy/archive.mjs verify "$payload" "$CANDIDATE_SHA"
          fi
          tar -czf "$RUNNER_TEMP/payload.tar.gz" -C "$payload" .
      - name: Transfer the verified payload and run the release action
        if: steps.verified.outputs.sha != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_TLS: ${{ vars.DEPLOY_TLS }}
          DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
          DEPLOY_ARCHIVE_ACTIVATE: ${{ vars.DEPLOY_ARCHIVE_ACTIVATE }}
          RELEASE_SHA: ${{ steps.verified.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/opt/hehuoda}
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9/_-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "${DEPLOY_TLS:-false}" =~ ^(true|false)$ ]]
          [[ "${DEPLOY_ARCHIVE_ACTIVATE:-false}" =~ ^(true|false)$ ]]
          [[ -z "$DEPLOY_PUBLIC_URL" || "$DEPLOY_PUBLIC_URL" =~ ^https?://[a-zA-Z0-9.:-]+/?$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          test -n "$DEPLOY_KNOWN_HOSTS"
          task_dir=$(mktemp -d)
          trap 'rm -rf -- "$task_dir"' EXIT
          chmod 700 "$task_dir"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$task_dir/known_hosts"
          ssh_args=(-p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$task_dir/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          if [[ -n "$DEPLOY_SSH_KEY" && -z "$DEPLOY_PASSWORD" ]]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$task_dir/key"
            chmod 600 "$task_dir/key"
            ssh_args+=(-o BatchMode=yes -o IdentitiesOnly=yes -i "$task_dir/key")
            transport=(ssh)
          elif [[ -n "$DEPLOY_PASSWORD" && -z "$DEPLOY_SSH_KEY" ]]; then
            if ! command -v sshpass >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq sshpass
            fi
            export SSHPASS="$DEPLOY_PASSWORD"
            transport=(sshpass -e ssh)
            ssh_args+=(-o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no)
          else
            echo 'Configure exactly one of DEPLOY_PASSWORD or DEPLOY_SSH_KEY.' >&2
            exit 1
          fi
          target="$DEPLOY_USER@$DEPLOY_HOST"
          # The server stores its own .env and never receives credentials from the checkout.
          remote() { timeout --signal=TERM --kill-after=5s "${2:-60}" "${transport[@]}" "${ssh_args[@]}" "$target" "$1" 2> "$task_dir/ssh.stderr"; }
          echo 'phase=connect status=started'
          if ! remote "test -d '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env' && command -v node >/dev/null && docker info >/dev/null && test -w '$DEPLOY_PATH'"; then
            echo 'phase=connect status=failed-or-timed-out' >&2
            exit 1
          fi
          echo 'phase=connect status=verified'
          if [[ "$DEPLOY_ACTION" == rollback ]]; then
            destination="$DEPLOY_PATH/controller/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          else
            destination="$DEPLOY_PATH/releases/$RELEASE_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          fi
          # One transfer attempt is bounded to ten minutes; two attempts reuse a
          # complete remote copy instead of retransmitting it.
          transfer() {
            local label="$1" source="$2" directory="$3" digest bytes attempt started transferred
            transfer_heartbeat=''
            transfer_directory="$directory"
            cleanup_transfer() {
              if [[ -n "$transfer_heartbeat" ]]; then
                kill "$transfer_heartbeat" 2>/dev/null || true
                wait "$transfer_heartbeat" 2>/dev/null || true
                transfer_heartbeat=''
              fi
              if [[ -n "$transfer_directory" ]]; then
                remote "rm -rf '$transfer_directory.incoming'" >/dev/null 2>&1 || true
                transfer_directory=''
              fi
            }
            trap 'cleanup_transfer; rm -rf -- "$task_dir"' EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            digest=$(sha256sum "$source" | cut -d' ' -f1)
            bytes=$(wc -c < "$source")
            for attempt in 1 2; do
              if [[ "$(remote "test -f '$directory/.payload' && cat '$directory/.payload'" 2>/dev/null || true)" == "$digest $bytes" ]]; then
                echo "phase=$label status=reused attempt=$attempt bytes=$bytes"
                cleanup_transfer
                return 0
              fi
              echo "phase=$label status=transferring attempt=$attempt bytes=$bytes"
              started=$(date +%s)
              (
                tick=''
                probe=''
                trap '[[ -z "$tick" ]] || kill "$tick" 2>/dev/null || true; [[ -z "$probe" ]] || kill "$probe" 2>/dev/null || true' EXIT
                trap 'exit 0' TERM INT
                while kill -0 "$$" 2>/dev/null; do
                  sleep 30 & tick=$!
                  wait "$tick" || break
                  remote "if test -f '$directory.incoming/payload.tar.gz'; then wc -c < '$directory.incoming/payload.tar.gz'; else echo 0; fi" 5 > "$task_dir/progress" & probe=$!
                  wait "$probe" || true
                  received=$(cat "$task_dir/progress" 2>/dev/null || true)
                  [[ "$received" =~ ^[0-9]+$ ]] || received=0
                  elapsed=$(( $(date +%s) - started ))
                  echo "phase=$label status=running attempt=$attempt elapsed=${elapsed}s received=$received total=$bytes bytes_per_second=$(( received / (elapsed + 1) ))"
                done
              ) &
              transfer_heartbeat=$!
              if timeout --signal=TERM --kill-after=30s 600 "${transport[@]}" "${ssh_args[@]}" "$target" "umask 077 && rm -rf '$directory.incoming' && mkdir -p '$directory.incoming' && cat > '$directory.incoming/payload.tar.gz'" < "$source" 2> "$task_dir/transfer.stderr"; then
                transferred=0
              else
                transferred=1
              fi
              kill "$transfer_heartbeat" 2>/dev/null || true
              wait "$transfer_heartbeat" 2>/dev/null || true
              transfer_heartbeat=''
              if [[ "$transferred" == 0 ]] && remote "test \"\$(sha256sum '$directory.incoming/payload.tar.gz' | cut -d' ' -f1)\" = '$digest' && test \"\$(wc -c < '$directory.incoming/payload.tar.gz')\" = '$bytes' && tar -xzf '$directory.incoming/payload.tar.gz' -C '$directory.incoming' && rm '$directory.incoming/payload.tar.gz' && printf '%s %s' '$digest' '$bytes' > '$directory.incoming/.payload' && rm -rf '$directory' && mv '$directory.incoming' '$directory'"; then
                echo "phase=$label status=transferred attempt=$attempt elapsed=$(( $(date +%s) - started ))s"
                cleanup_transfer
                return 0
              fi
              echo "phase=$label status=retrying attempt=$attempt elapsed=$(( $(date +%s) - started ))s" >&2
              if [[ "$attempt" == 1 ]]; then sleep 10; fi
            done
            echo "phase=$label status=transfer-failed attempts=2" >&2
            cleanup_transfer
            return 1
          }
          # Measure the same SSH upload path before committing to a full archive.
          # Include SSH setup in the estimate, so a marginal link fails conservatively.
          payload_bytes=$(wc -c < "$RUNNER_TEMP/payload.tar.gz")
          probe_bytes=$(( payload_bytes < 1048576 ? payload_bytes : 1048576 ))
          echo "phase=link-probe status=started bytes=$probe_bytes"
          head -c "$probe_bytes" /dev/urandom > "$task_dir/probe"
          probe_started=$(date +%s)
          if ! timeout --signal=TERM --kill-after=5s 60 "${transport[@]}" "${ssh_args[@]}" "$target" 'cat > /dev/null' < "$task_dir/probe" 2> "$task_dir/probe.stderr"; then
            echo 'phase=link-probe status=failed-or-timed-out limit=60s' >&2
            exit 1
          fi
          probe_elapsed=$(( $(date +%s) - probe_started ))
          probe_elapsed=$(( probe_elapsed > 0 ? probe_elapsed : 1 ))
          estimated=$(( payload_bytes * probe_elapsed / probe_bytes ))
          echo "phase=link-probe status=measured elapsed=${probe_elapsed}s bytes_per_second=$(( probe_bytes / probe_elapsed )) estimated_payload_seconds=$estimated"
          if [[ "$estimated" -gt 600 ]]; then
            echo 'phase=link-probe status=insufficient-throughput transfer_limit=600s' >&2
            exit 1
          fi
          transfer payload "$RUNNER_TEMP/payload.tar.gz" "$destination"
          echo "phase=delivery status=started action=$DEPLOY_ACTION"
          remote "cd '$destination' && DEPLOY_ROOT='$DEPLOY_PATH' DEPLOY_ENV_FILE='$DEPLOY_PATH/.env' DEPLOY_STATE_DIR='$DEPLOY_PATH/state' DEPLOY_BACKUP_DIR='$DEPLOY_PATH/backups' DEPLOY_TLS='${DEPLOY_TLS:-false}' DEPLOY_PUBLIC_URL='$DEPLOY_PUBLIC_URL' DEPLOY_ARCHIVE_ACTIVATE='${DEPLOY_ARCHIVE_ACTIVATE:-false}' node deploy/delivery.mjs '$DEPLOY_ACTION' '$RELEASE_SHA' '$destination'" 1200
