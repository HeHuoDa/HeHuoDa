name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA with successful push/manual CI and published images
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: hehuoda-production-deploy
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Verify the exact main release passed CI and published images
        id: verified
        env:
          RELEASE_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$RELEASE_EVENT" == workflow_run ]]; then
            current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
            if [[ "$current_main" != "$CANDIDATE_SHA" ]]; then
              echo 'Skipping superseded automatic release; explicit manual rollback remains available.'
              exit 0
            fi
          fi
          published=false
          for ci_event in push workflow_dispatch; do
            run_ids=$(gh api --paginate "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE_SHA&branch=main&event=$ci_event&status=success&per_page=100" --jq '.workflow_runs[].id')
            for run_id in $run_ids; do
              artifacts=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
              for artifact in $artifacts; do
                if [[ "$artifact" =~ ^release-images-$CANDIDATE_SHA-([0-9]+)$ ]]; then
                  attempt="${BASH_REMATCH[1]}"
                  publish_counts=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run_id/attempts/$attempt/jobs?per_page=100" --jq '[.jobs[] | select(.name == "publish-images" and .conclusion == "success")] | length')
                  if grep -Eq '^[1-9][0-9]*$' <<< "$publish_counts"; then
                    published=true
                    break 3
                  fi
                fi
              done
            done
          done
          if [[ "$published" != true ]]; then
            echo 'No successful main CI with published images and a retained digest manifest for the exact SHA.' >&2
            exit 1
          fi
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.verified.outputs.sha != ''
        with:
          ref: ${{ steps.verified.outputs.sha }}
          persist-credentials: false
      - name: Download the successful run's digest manifest
        if: steps.verified.outputs.sha != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.verified.outputs.artifact }}
          run-id: ${{ steps.verified.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-manifest
      - name: Validate release digests before connecting to the server
        if: steps.verified.outputs.sha != ''
        env:
          MANIFEST_DIR: ${{ runner.temp }}/release-manifest
          TCR_IMAGE_PREFIX: ${{ vars.TCR_IMAGE_PREFIX }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readReleaseManifest } from "./deploy/manifest.mjs";
            const images = readReleaseManifest(process.env.MANIFEST_DIR, process.env.CANDIDATE_SHA);
            const prefixes = [`ghcr.io/${process.env.GH_REPO.toLowerCase()}`, process.env.TCR_IMAGE_PREFIX].filter(Boolean);
            for (const component of ["api", "web"]) {
              if (!prefixes.some(prefix => images[component].startsWith(`${prefix}/${component}@sha256:`))) throw new Error("Unexpected image repository");
            }
          '
          cp "$MANIFEST_DIR/release.json" release.json
      - name: Transfer the verified release and deploy
        if: steps.verified.outputs.sha != ''
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RELEASE_SHA: ${{ steps.verified.outputs.sha }}
          DEPLOY_TLS: ${{ vars.DEPLOY_TLS }}
          DEPLOY_PUBLIC_URL: ${{ vars.DEPLOY_PUBLIC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          DEPLOY_PORT=${DEPLOY_PORT:-22}
          DEPLOY_PATH=${DEPLOY_PATH:-/opt/hehuoda}
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9/_-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "${DEPLOY_TLS:-false}" =~ ^(true|false)$ ]]
          [[ -z "$DEPLOY_PUBLIC_URL" || "$DEPLOY_PUBLIC_URL" =~ ^https?://[a-zA-Z0-9.:-]+/?$ ]]
          test -n "$DEPLOY_KNOWN_HOSTS"
          task_dir=$(mktemp -d)
          trap 'rm -rf -- "$task_dir"' EXIT
          chmod 700 "$task_dir"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$task_dir/known_hosts"
          ssh_args=(-p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$task_dir/known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=6)
          if [[ -n "$DEPLOY_SSH_KEY" && -z "$DEPLOY_PASSWORD" ]]; then
            printf '%s\n' "$DEPLOY_SSH_KEY" > "$task_dir/key"
            chmod 600 "$task_dir/key"
            ssh_args+=(-o BatchMode=yes -o IdentitiesOnly=yes -i "$task_dir/key")
            transport=(ssh)
          elif [[ -n "$DEPLOY_PASSWORD" && -z "$DEPLOY_SSH_KEY" ]]; then
            if ! command -v sshpass >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq sshpass
            fi
            export SSHPASS="$DEPLOY_PASSWORD"
            transport=(sshpass -e ssh)
            ssh_args+=(-o PreferredAuthentications=password,keyboard-interactive -o PubkeyAuthentication=no)
          else
            echo 'Configure exactly one of DEPLOY_PASSWORD or DEPLOY_SSH_KEY.' >&2
            exit 1
          fi
          target="$DEPLOY_USER@$DEPLOY_HOST"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          release_dir="$DEPLOY_PATH/releases/$RELEASE_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          "${transport[@]}" "${ssh_args[@]}" "$target" "test -d '$DEPLOY_PATH' && test -f '$DEPLOY_PATH/.env' && command -v node >/dev/null && docker info >/dev/null"
          # The server stores its own registry login and .env; neither is transferred from the checkout.
          tar -czf "$task_dir/release.tar.gz" release.json compose.deploy.yaml compose.tls.yaml deploy/nginx/https.conf deploy/runtime.mjs deploy/release.mjs deploy/backup.mjs deploy/manifest.mjs
          "${transport[@]}" "${ssh_args[@]}" "$target" "test ! -e '$release_dir' && mkdir -p '$release_dir' && tar -xzf - -C '$release_dir'" < "$task_dir/release.tar.gz"
          "${transport[@]}" "${ssh_args[@]}" "$target" "cd '$release_dir' && DEPLOY_TLS='${DEPLOY_TLS:-false}' DEPLOY_PUBLIC_URL='$DEPLOY_PUBLIC_URL' DEPLOY_ENV_FILE='$DEPLOY_PATH/.env' DEPLOY_STATE_DIR='$DEPLOY_PATH/state' DEPLOY_BACKUP_DIR='$DEPLOY_PATH/backups' node deploy/release.mjs '$RELEASE_SHA'"
