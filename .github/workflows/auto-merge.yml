name: Auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [ready_for_review]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  auto-merge:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    concurrency:
      group: auto-merge-${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 不检出或执行 PR 代码；只通过 GitHub API 操作已通过 CI 的提交。
      - name: Merge verified PR, dispatch main CI and delete its branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
          READY_PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$READY_PR" ]]; then
            prs=$READY_PR
          else
            prs=$(gh pr list --repo "$GH_REPO" --base main \
              --head "$HEAD_BRANCH" --state open \
              --json number,headRefOid,isDraft,isCrossRepository \
              --jq ".[] | select(.headRefOid == \"$HEAD_SHA\" and .isDraft == false and .isCrossRepository == false) | .number")
          fi

          if [[ -z "$prs" ]]; then
            echo "No eligible PR for this verified commit."
            exit 0
          fi

          while IFS= read -r pr; do
            if [[ -n "$READY_PR" ]]; then
              # 使用 GitHub 当前的 PR 合并状态和必需检查，避免复用已落后于 main 的结果。
              for attempt in 1 2 3; do
                current_pr=$(gh pr view "$pr" --repo "$GH_REPO" \
                  --json state,baseRefName,headRefOid,isDraft,isCrossRepository,mergeStateStatus \
                  --jq 'select(.state == "OPEN" and .baseRefName == "main" and
                    .isDraft == false and .isCrossRepository == false)
                    | [.headRefOid, .mergeStateStatus] | @tsv')
                IFS=$'\t' read -r current_head merge_state <<< "$current_pr"
                if [[ "$current_head" != "$HEAD_SHA" || "$merge_state" != "UNKNOWN" ]]; then
                  break
                fi
                if [[ "$attempt" == 3 ]]; then
                  echo "GitHub still cannot determine PR #$pr merge state." >&2
                  exit 1
                fi
                sleep 5
              done
              if [[ "$current_head" != "$HEAD_SHA" || ! "$merge_state" =~ ^(CLEAN|BLOCKED|HAS_HOOKS|UNSTABLE)$ ]]; then
                echo "PR #$pr changed or is ineligible for Ready auto-merge."
                continue
              fi

              if ! gate_passed=$(gh pr checks "$pr" --repo "$GH_REPO" --required \
                  --json name,workflow,state \
                  --jq 'map(select(.name == "ci-gate" and .workflow == "CI"))
                    | length > 0 and all(.state == "SUCCESS")') || [[ "$gate_passed" != "true" ]]; then
                echo "PR #$pr has no verified required CI gate yet."
                continue
              fi
            fi

            gh pr merge "$pr" --repo "$GH_REPO" --auto --merge \
              --match-head-commit "$HEAD_SHA"

            # --auto 可能只启用等待合并；未实际合并时必须保留来源分支。
            default_branch=$(gh repo view "$GH_REPO" --json defaultBranchRef \
              --jq '.defaultBranchRef.name')
            pr_info=$(gh pr view "$pr" --repo "$GH_REPO" \
              --json state,headRefOid,headRefName,isCrossRepository \
              --jq '[.state, .headRefOid, .headRefName, .isCrossRepository] | @tsv')
            IFS=$'\t' read -r state merged_head branch cross_repository <<< "$pr_info"
            if [[ "$state" != "MERGED" || "$merged_head" != "$HEAD_SHA" || \
                  "$branch" != "$HEAD_BRANCH" || "$cross_repository" != "false" || \
                  "$branch" == "$default_branch" ]]; then
              echo "PR #$pr is pending or its branch is ineligible for deletion; keeping branch."
              continue
            fi

            # GITHUB_TOKEN 合并产生的 push 不会触发 CI，必须显式 dispatch。
            # 发布的是 dispatch 时固定的 main SHA；不能检出或执行 PR 代码。
            # 分支是否可以删除不影响发布，dispatch 失败时保留分支并报错。
            gh workflow run ci.yml --repo "$GH_REPO" --ref "$default_branch"

            # 避免删除其他打开的 PR 使用的来源分支或目标分支。
            open_prs=$(gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
              | jq -r --arg branch "$branch" --arg repo "$GH_REPO" \
                '.[] | select((.head.repo.full_name == $repo and .head.ref == $branch) or .base.ref == $branch) | .number')
            if [[ -n "$open_prs" ]]; then
              echo "Branch $branch is referenced by open PRs; keeping branch."
              continue
            fi

            # 删除前核对远程最新 SHA；已删除、受保护或有新提交的分支不处理。
            branch_info=$(gh api --paginate "repos/$GH_REPO/branches?per_page=100" \
              | jq -r --arg branch "$branch" \
                '.[] | select(.name == $branch) | [.commit.sha, .protected] | @tsv')
            IFS=$'\t' read -r branch_sha protected <<< "$branch_info"
            if [[ "$branch_sha" != "$HEAD_SHA" || "$protected" != "false" ]]; then
              echo "Branch $branch is absent, protected, or has new commits; skipping deletion."
              continue
            fi

            gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "Deleted merged remote branch $branch."
          done <<< "$prs"
