name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hehuoda
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: hehuoda_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hehuoda -d hehuoda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hehuoda:ci_only@127.0.0.1:5432/hehuoda_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test:deployment
      - name: Verify real SSH transfer faults on an isolated loopback server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server > /dev/null
          sudo mkdir -p /run/sshd
          node --test deploy/test/transfer.integration.mjs
      - run: pnpm api:generate
      - run: git diff --exit-code -- apps/api/openapi.json packages/api-types/src/generated/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:e2e

  image-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_PREFIX: hehuoda-local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Build actual images and run isolated smoke checks
        env:
          DEPLOY_STATE_DIR: ${{ runner.temp }}/smoke-state
        run: node deploy/smoke.mjs
      - name: Verify real archive preparation, rollback and retention in isolation
        run: node --test deploy/test/archive.integration.mjs
      - name: Retain safe failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-state/logs/*.json
          retention-days: 7
          if-no-files-found: ignore
      # The archive reuses the images that just passed smoke checks; nothing is rebuilt.
      - name: Save the verified images with their archive manifest
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/release-archive"
          mkdir -p "$directory"
          docker image save "$IMAGE_PREFIX/api:$IMAGE_TAG" "$IMAGE_PREFIX/web:$IMAGE_TAG" | gzip > "$directory/images.tar.gz"
          node deploy/archive.mjs create "$directory" "$IMAGE_TAG"
      - name: Retain the deployable archive for seven days
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-archive
          retention-days: 7
          if-no-files-found: error

  ci-gate:
    name: ci-gate
    needs: [quality, image-smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No publishing job and no package-write scope: the archive uploaded by
      # image-smoke is the only deployable artifact for a main commit.
      - run: test "$QUALITY_RESULT" = "success" && test "$IMAGE_RESULT" = "success"
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          IMAGE_RESULT: ${{ needs.image-smoke.result }}
