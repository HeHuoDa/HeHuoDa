name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'main' }}-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hehuoda
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: hehuoda_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U hehuoda -d hehuoda_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://hehuoda:ci_only@127.0.0.1:5432/hehuoda_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test:deployment
      # openapi:write builds the Node workspace dependency even before the root build.
      - run: pnpm api:generate
      - run: git diff --exit-code -- apps/api/openapi.json packages/api-types/src/generated/schema.d.ts
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm test:e2e

  image-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      images-artifact-id: ${{ steps.images.outputs.artifact-id }}
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Select immutable image names
        shell: bash
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Build actual images and run isolated smoke checks
        env:
          DEPLOY_STATE_DIR: ${{ runner.temp }}/smoke-state
        run: node deploy/smoke.mjs
      - name: Retain safe failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/smoke-state/logs/*.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Save verified main images for the publishing job
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          docker image save "$IMAGE_PREFIX/api:$IMAGE_TAG" "$IMAGE_PREFIX/web:$IMAGE_TAG" | gzip > "$RUNNER_TEMP/verified-images.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: images
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          name: verified-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-images.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish-images:
    needs: image-smoke
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      # No source checkout or repository scripts run with the package-write token.
      - name: Require the verified producer artifact ID
        env:
          VERIFIED_ARTIFACT_ID: ${{ needs.image-smoke.outputs.images-artifact-id }}
        shell: bash
        run: '[[ "$VERIFIED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.image-smoke.outputs.images-artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/verified-images
      - name: Load and publish the exact verified images
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          gzip -dc "$RUNNER_TEMP/verified-images/verified-images.tar.gz" | docker image load
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          present=()
          missing=()
          for component in api web; do
            image="$IMAGE_PREFIX/$component:$IMAGE_TAG"
            # Include push scope so a new package can be distinguished from denied access.
            registry_token=$(printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" \
              | curl --config - --fail --silent --show-error --connect-timeout 15 --max-time 30 --get \
                --data-urlencode "scope=repository:${GITHUB_REPOSITORY,,}/$component:pull,push" \
                --data-urlencode 'service=ghcr.io' https://ghcr.io/token \
              | jq -er '.token // .access_token')
            status=$(printf 'header = "Authorization: Bearer %s"\n' "$registry_token" \
              | curl --config - --silent --show-error --connect-timeout 15 --max-time 30 --head --output /dev/null --write-out '%{http_code}' \
                --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                "https://ghcr.io/v2/${GITHUB_REPOSITORY,,}/$component/manifests/$IMAGE_TAG")
            unset registry_token
            case "$status" in
              200) present+=("$image") ;;
              404) missing+=("$image") ;;
              *) echo 'Cannot establish registry image state; refusing to publish.' >&2; exit 1 ;;
            esac
          done
          for image in "${present[@]}"; do
            candidate_id=$(docker image inspect --format '{{.Id}}' "$image")
            docker pull "$image"
            existing_id=$(docker image inspect --format '{{.Id}}' "$image")
            if [[ "$candidate_id" != "$existing_id" ]]; then
              echo 'Existing release differs from the verified artifact; rerun the original publishing job or publish a new commit.' >&2
              exit 1
            fi
          done
          for image in "${missing[@]}"; do
            docker push "$image"
          done
          # Pin what was actually verified, including retries and existing releases.
          refs=()
          for component in api web; do
            image="$IMAGE_PREFIX/$component:$IMAGE_TAG"
            candidate_id=$(docker image inspect --format '{{.Id}}' "$image")
            docker pull "$image"
            ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
            [[ "$ref" == "$IMAGE_PREFIX/$component@sha256:"* ]]
            [[ "${ref##*@sha256:}" =~ ^[a-f0-9]{64}$ ]]
            docker pull "$ref"
            [[ "$(docker image inspect --format '{{.Id}}' "$ref")" == "$candidate_id" ]]
            refs+=("$ref")
          done
          mkdir -p "$RUNNER_TEMP/release-manifest"
          printf '{"sha":"%s","images":{"api":"%s","web":"%s"}}\n' "$IMAGE_TAG" "${refs[0]}" "${refs[1]}" > "$RUNNER_TEMP/release-manifest/release.json"
      - name: Mirror verified images to Tencent TCR when configured
        env:
          TCR_IMAGE_PREFIX: ${{ vars.TCR_IMAGE_PREFIX }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TCR_IMAGE_PREFIX" ]]; then
            [[ -z "$TCR_USERNAME" && -z "$TCR_PASSWORD" ]] || { echo 'TCR credentials require TCR_IMAGE_PREFIX.' >&2; exit 1; }
            echo 'TCR is not configured; retaining the verified GHCR release.'
            exit 0
          fi
          [[ "$TCR_IMAGE_PREFIX" =~ ^(ccr\.ccs\.tencentyun\.com|[a-z0-9][a-z0-9-]*\.tencentcloudcr\.com)/[a-z0-9][a-z0-9_-]*$ ]]
          [[ -n "$TCR_USERNAME" && -n "$TCR_PASSWORD" ]]
          registry="${TCR_IMAGE_PREFIX%%/*}"
          printf '%s' "$TCR_PASSWORD" | docker login "$registry" --username "$TCR_USERNAME" --password-stdin
          trap 'docker logout "$registry" >/dev/null 2>&1 || true' EXIT
          manifest="$RUNNER_TEMP/release-manifest/release.json"
          missing=()
          candidates=()
          for component in api web; do
            source=$(jq -er --arg component "$component" '.images[$component]' "$manifest")
            candidate_id=$(docker image inspect --format '{{.Id}}' "$source")
            candidates+=("$candidate_id")
            target="$TCR_IMAGE_PREFIX/$component:$IMAGE_TAG"
            if docker manifest inspect "$target" > /dev/null 2> "$RUNNER_TEMP/tcr-inspect-error"; then
              docker pull "$target"
              [[ "$(docker image inspect --format '{{.Id}}' "$target")" == "$candidate_id" ]] || {
                echo 'Existing TCR release differs from the verified image; refusing to overwrite.' >&2; exit 1;
              }
            elif grep -Eqi 'manifest unknown|no such manifest' "$RUNNER_TEMP/tcr-inspect-error"; then
              docker tag "$source" "$target"
              missing+=("$target")
            else
              echo 'Cannot establish TCR image state; check credentials, repository and network.' >&2
              exit 1
            fi
          done
          for image in "${missing[@]}"; do docker push "$image"; done
          refs=()
          index=0
          for component in api web; do
            image="$TCR_IMAGE_PREFIX/$component:$IMAGE_TAG"
            docker pull "$image"
            ref=$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" | grep -F "$TCR_IMAGE_PREFIX/$component@sha256:")
            [[ "$ref" == "$TCR_IMAGE_PREFIX/$component@sha256:"* && "${ref##*@sha256:}" =~ ^[a-f0-9]{64}$ ]]
            docker pull "$ref"
            [[ "$(docker image inspect --format '{{.Id}}' "$ref")" == "${candidates[$index]}" ]]
            refs+=("$ref")
            index=$((index + 1))
          done
          printf '{"sha":"%s","images":{"api":"%s","web":"%s"}}\n' "$IMAGE_TAG" "${refs[0]}" "${refs[1]}" > "$manifest"
      - name: Retain immutable release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-manifest/release.json
          retention-days: 90
          if-no-files-found: error

  ci-gate:
    name: ci-gate
    needs: [quality, image-smoke, publish-images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$QUALITY_RESULT" = "success" && test "$IMAGE_RESULT" = "success"
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          IMAGE_RESULT: ${{ needs.image-smoke.result }}
      - name: Require image publishing for main releases
        run: test "$PUBLISH_RESULT" = "success" || test "$PUBLISH_REQUIRED" = "false"
        env:
          PUBLISH_RESULT: ${{ needs.publish-images.result }}
          PUBLISH_REQUIRED: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
